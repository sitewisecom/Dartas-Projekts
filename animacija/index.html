<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#b9bec8"/>
      <stop offset="0.6" stop-color="#eef1f5"/><stop offset="1" stop-color="#7d8490"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b0"/><stop offset="0.4" stop-color="#d9a72e"/>
      <stop offset="0.7" stop-color="#ffe08a"/><stop offset="1" stop-color="#9c6d12"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>

  <rect width="1920" height="1080" filter="url(#paper)" pointer-events="none"/>
  <rect width="1920" height="1080" fill="url(#vignette)" pointer-events="none"/>

<script>
  // seek(t): deterministic frame for time t (seconds) — used by the frame renderer
  window.seek = function (t) {
    tl.time(t, false);
    for (const u of updaters) u(t);
    for (const d of drawers) d(t);
  };
  window.DURATION = tl.duration();
  document.fonts.ready.then(() => { window.READY = true; seek(0); });
</script>
